<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Composiciones Musicales para el Alma</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Composiciones Musicales para el Alma">
<meta property="og:description" content="Una colección iniciática de obras musicales.">
<meta property="og:image" content="https://lucksys.github.io/canciones/portada.jpg">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Composiciones Musicales para el Alma">
<meta name="twitter:image" content="https://lucksys.github.io/canciones/portada.jpg">

<style>
:root{
--gold:#d4af37;
--bg:rgba(0,0,0,.92);
--panel:rgba(10,10,10,.78);
--card:#111;
--text:#f3e7b3;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Georgia,serif;
background:url("portada.jpg") no-repeat center fixed;
background-size:cover;
color:var(--gold)
}

.overlay{
background:var(--bg);
min-height:100vh;
padding:20px
}

h1{
text-align:center;
text-shadow:0 0 15px var(--gold)
}

.container{
display:flex;
gap:20px;
flex-wrap:wrap
}

.column{
flex:1;
min-width:320px;
border:1px solid var(--gold);
padding:15px;
border-radius:12px;
background:var(--panel)
}

.grid{
display:grid;
gap:25px
}

.card{
position:relative;
background:var(--card);
border:1px solid var(--gold);
border-radius:12px;
overflow:hidden;
display:flex;
flex-direction:column
}

.card:hover{
box-shadow:0 0 20px var(--gold)
}

.card-title{
padding:10px 12px;
text-align:left;
color:var(--text);
line-height:1.2;
word-break:break-word
}

/* Primera línea de botones */
.button-row-top{
display:grid;
grid-template-columns:1.25fr 1.25fr .6fr;
gap:6px;
padding:0 12px 8px;
width:100%
}

/* Segunda línea */
.button-row-bottom{
padding:0 12px 10px;
width:100%
}

.copy-btn,
.info-btn,
.song-btn{
height:32px;
background:#000;
color:#fff;
border:1px solid var(--gold);
font-size:12px;
font-weight:normal;
cursor:pointer;
white-space:nowrap;
width:100%;
min-width:0;
padding:0 4px
}

.song-btn{
font-size:13px
}

.card img{
width:100%;
display:block;
background:#000;
cursor:pointer
}

/* Aviso de copia en escritorio */
.copy-notification{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,.96);
color:var(--text);
border:2px solid var(--gold);
border-radius:12px;
padding:22px 35px;
min-width:360px;
max-width:80vw;
text-align:center;
font-family:Georgia,serif;
font-size:20px;
font-weight:bold;
line-height:1.4;
box-shadow:0 0 25px rgba(212,175,55,.55);
z-index:9999;
display:none;
pointer-events:none
}

.copy-notification.active{
display:block
}

.info-overlay{
position:fixed;
inset:0;
background:#000a;
display:none;
align-items:center;
justify-content:center
}

.info-overlay.active{
display:flex
}

.info-popup{
position:relative;
background:#111;
padding:20px;
border:1px solid var(--gold);
max-width:500px;
width:90%
}

.info-close{
position:absolute;
top:10px;
right:10px;
background:#000;
color:#fff;
border:1px solid var(--gold);
font-weight:normal;
cursor:pointer
}
</style>
</head>

<body>

<div class="overlay">

<h1>Composiciones Musicales para el Alma</h1>

<div class="container">

<div class="column">

<h2>Videos Karaoke</h2>

<div id="videos" class="grid">
<div class="loading">Cargando...</div>
</div>

</div>

<div class="column">

<h2>Video-Presentaciones / Video-Planchas</h2>

<div class="grid">
<p>Próximamente...</p>
</div>

</div>

</div>
</div>

<div id="copyNotification" class="copy-notification"></div>

<div id="infoOverlay" class="info-overlay">

<div class="info-popup">

<button id="infoClose" class="info-close">X</button>

<h3 id="infoTitulo"></h3>

<p id="infoTexto"></p>

</div>

</div>

<script>
(function(){

const contenedor=document.getElementById("videos");
const infoOverlay=document.getElementById("infoOverlay");
const infoTitulo=document.getElementById("infoTitulo");
const infoTexto=document.getElementById("infoTexto");
const copyNotification=document.getElementById("copyNotification");

document.getElementById("infoClose").onclick=()=>{
infoOverlay.classList.remove("active")
};

/* Escritorio sin Android/iOS ni pantalla táctil */
function esEscritorio(){
return !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
&& navigator.maxTouchPoints===0
&& !("ontouchstart" in window);
}

/* Aviso de copia */
let notificationTimer;

function mostrarAviso(tipo,titulo){

if(!esEscritorio())return;

copyNotification.innerHTML=
tipo+": &quot;"+titulo+
&quot;.&quot;<br>Copiado al Portapapeles.;

copyNotification.classList.add("active");

clearTimeout(notificationTimer);

notificationTimer=setTimeout(()=>{
copyNotification.classList.remove("active")
},2500);
}

function abrirInfo(titulo,texto){
infoTitulo.textContent=titulo;
infoTexto.textContent=texto;
infoOverlay.classList.add("active")
}

function getValue(line){
const m=line.match(/:\s*"?([^"]+)/);
return m?m[1].trim():null
}

function parseBloque(lineas){

let indice=null,titulo="",imagen=null,video=null,
cancion=null,webVideo=null,webAudio=null,info=[];

for(let i=0;i<lineas.length;i++){

let l=lineas[i];

if(i===0){
let m=l.match(/^\s*(\d+)\s*-\s*(.+)/);
if(m){
indice=parseInt(m[1]);
titulo=m[2].replaceAll("_"," ").trim()
}
}

if(/^url-imagen/i.test(l))imagen=getValue(l);
if(/^url-video/i.test(l))video=getValue(l);
if(/^url-cancion/i.test(l))cancion=getValue(l);
if(/^web-video/i.test(l))webVideo=getValue(l);
if(/^web-audio/i.test(l))webAudio=getValue(l);

if(/^info/i.test(l)){

info.push(
l.replace(/^info\s*:/i,"")
.replace(/^\s*"+/,"")
.trim()
);

for(let j=i+1;j<lineas.length;j++){
info.push(
lineas[j]
.replace(/^"+/,"")
.replace(/"+$/,"")
.trim()
)
}

break
}

}

if(!imagen||!video||!cancion)return null;

return{
indice,
titulo,
imagen,
video,
cancion,
webVideo,
webAudio,
info:info.join("\n").replace(/-{3,}/g,"").trim()
}
}

async function copiarURL(url){

try{
await navigator.clipboard.writeText(url);
return true
}catch(e){

try{

const tmp=document.createElement("input");
tmp.value=url;
document.body.appendChild(tmp);
tmp.select();
document.execCommand("copy");
document.body.removeChild(tmp);
return true

}catch(error){

console.error(error);
return false

}

}

}

async function cargar(){

try{

const res=await fetch(
"./Lista_de_Enlaces_de_Videos.txt"
);

if(!res.ok)throw new Error("TXT no encontrado");

const txt=await res.text();

const bloques=txt.split(
/\n(?=\s*\d+\s*-\s*)/
);

contenedor.innerHTML="";

let total=0;

for(const b of bloques){

const lineas=b.split("\n")
.map(l=>l.trim())
.filter(Boolean);

const d=parseBloque(lineas);

if(!d||d.indice===null||d.indice===0)continue;

const card=document.createElement("div");
card.className="card";

const titulo=document.createElement("div");
titulo.className="card-title";
titulo.textContent=d.indice+" - "+d.titulo;

const buttonRowTop=document.createElement("div");
buttonRowTop.className="button-row-top";

const buttonRowBottom=document.createElement("div");
buttonRowBottom.className="button-row-bottom";

/* Copiar URL-Video: web-video: */
const copyVideoBtn=document.createElement("button");
copyVideoBtn.className="copy-btn";
copyVideoBtn.textContent="Copiar URL-Video";

copyVideoBtn.onclick=async(e)=>{

e.stopPropagation();

if(d.webVideo){

const ok=await copiarURL(d.webVideo);

if(ok)
mostrarAviso(
"URL-Video",
d.titulo
);

}

};

/* Copiar URL-Cancion: web-audio: */
const copySongBtn=document.createElement("button");
copySongBtn.className="copy-btn";
copySongBtn.textContent="Copiar URL-Cancion";

copySongBtn.onclick=async(e)=>{

e.stopPropagation();

if(d.webAudio){

const ok=await copiarURL(d.webAudio);

if(ok)
mostrarAviso(
"URL-Cancion",
d.titulo
);

}

};

/* Info */
const infoBtn=document.createElement("button");
infoBtn.className="info-btn";
infoBtn.textContent="info";

infoBtn.onclick=(e)=>{

e.stopPropagation();

abrirInfo(d.titulo,d.info)

};

/* Solo Cancion */
const btnCancion=document.createElement("button");
btnCancion.className="song-btn";
btnCancion.textContent="Solo Cancion";

btnCancion.onclick=(e)=>{

e.stopPropagation();

window.open(d.cancion,"_blank")

};

/* Orden */
buttonRowTop.appendChild(copyVideoBtn);
buttonRowTop.appendChild(copySongBtn);
buttonRowTop.appendChild(infoBtn);

buttonRowBottom.appendChild(btnCancion);

/* Imagen */
const img=document.createElement("img");

img.src=d.imagen;

img.onerror=function(){
this.onerror=null;
this.src="portada.jpg"
};

img.onclick=()=>{
window.open(d.video,"_blank")
};

/* Tarjeta */
card.appendChild(titulo);
card.appendChild(buttonRowTop);
card.appendChild(buttonRowBottom);
card.appendChild(img);

contenedor.appendChild(card);

total++
}

if(total===0)
contenedor.innerHTML="No se encontraron obras";

}catch(e){

contenedor.innerHTML="Error cargando la lista";
console.error(e)

}

}

cargar();

})();
</script>

</body>
</html>
